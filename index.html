<!DOCTYPE html>

<html lang="ko">

<head>

  <!-- =========================
       META
  ========================== -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      viewport-fit=cover
    "
  />

  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <meta
    name="theme-color"
    content="#0f172a"
  />

  <!-- =========================
       TITLE
  ========================== -->

  <title>
    Swim App
  </title>

  <!-- =========================
       FAVICON
  ========================== -->

  <link
    rel="icon"
    type="image/png"
    href="./favicon.png"
  />

  <!-- =========================
       FONT
  ========================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="
      https://fonts.googleapis.com/css2?
      family=Pretendard:wght@400;500;600;700&
      display=swap
    "
    rel="stylesheet"
  />

  <!-- =========================
       CSS
  ========================== -->

  <link
    rel="stylesheet"
    href="./css/style.css?v=3"
  />

</head>

<body>

  <!-- =========================
       SPLASH
  ========================== -->

  <div id="splash">

    <div class="splash-bg"></div>

    <div class="splash-inner">

      <img
        class="splash-dolphin"
        src="./assets/splash.png"
        alt="Swim Splash"
        draggable="false"
      />

      <div class="splash-title">
        SWIM APP
      </div>

      <div class="splash-sub">
        TODAY SWIM STYLE
      </div>

    </div>

  </div>

  <!-- =========================
       APP ROOT
  ========================== -->

  <main id="app"></main>

  <!-- =========================
       TEMPLATE
  ========================== -->

  <template id="loadingTemplate">

    <div class="app-loading">

      <div class="loading-spinner"></div>

      <div class="loading-text">
        로딩중...
      </div>

    </div>

  </template>

  <!-- =========================
       NOSCRIPT
  ========================== -->

  <noscript>

    <div class="noscript-box">

      JavaScript가 필요합니다.

    </div>

  </noscript>

  <!-- =========================
       SCRIPT
  ========================== -->

  <script
    type="module"
    src="./js/app.js?v=3"
  ></script>

</body>

</html>
